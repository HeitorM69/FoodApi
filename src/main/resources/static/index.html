<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Jabuti - Cardápio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="casa">
    <div class="casa-miolo">
      <p class="casa-nome">Casa Jabuti</p>
      <p class="casa-frase">Cozinha de panela grande e tempo de sobra. Hoje a gente serve o que está no cardápio abaixo.</p>
    </div>
  </header>

  <p id="mensagem" role="status" aria-live="polite"></p>

  <div class="pagina">
    <main class="cardapio-area">
      <h1 class="titulo-pagina">O cardápio</h1>

      <div class="filtros">
        <div class="campo">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria">
            <option value="">Todas</option>
            <option value="ENTRADA">Entrada</option>
            <option value="PRATO_PRINCIPAL">Prato principal</option>
            <option value="SOBREMESA">Sobremesa</option>
            <option value="BEBIDA">Bebida</option>
            <option value="LANCHE">Lanche</option>
          </select>
        </div>
        <div class="campo campo-busca">
          <label for="busca-nome">Buscar por nome</label>
          <input type="text" id="busca-nome">
        </div>
        <div class="botoes">
          <button type="button" id="btn-buscar" class="primario">Buscar</button>
          <button type="button" id="btn-limpar">Limpar</button>
        </div>
      </div>

      <div id="cardapio"></div>
    </main>

    <aside class="cozinha" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Nova comida</h2>
      <p class="cozinha-nota">Área da cozinha: cadastre e ajuste os pratos da casa.</p>
      <form id="form-comida">
        <input type="hidden" id="id">

        <label for="nome">Nome</label>
        <input type="text" id="nome" maxlength="100" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="2"></textarea>

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" min="0.01" required>

        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="ENTRADA">Entrada</option>
          <option value="PRATO_PRINCIPAL">Prato principal</option>
          <option value="SOBREMESA">Sobremesa</option>
          <option value="BEBIDA">Bebida</option>
          <option value="LANCHE">Lanche</option>
        </select>

        <label for="tempo">Tempo de preparo (minutos)</label>
        <input type="number" id="tempo" min="1" step="1">

        <label class="inline"><input type="checkbox" id="disponivel" checked> Disponível hoje</label>

        <div class="botoes">
          <button type="submit" id="btn-salvar" class="primario">Salvar</button>
          <button type="button" id="btn-cancelar" hidden>Cancelar edição</button>
        </div>
      </form>
    </aside>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
